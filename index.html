<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-1oiFqVFd2OsHhLed96p3K6O+2qy0NdrVG81nTDJ4cbo='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Mis Finanzas</title>
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Diseño: app de finanzas personal. Móvil primero con barra inferior y botón central de registrar;
   en escritorio, barra lateral. Una sola cifra protagonista por pantalla, colores semánticos solo para estado. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --surface-3:#e4e8ee;
  --ink:#0e1726; --ink-2:#2b3647; --muted:#5d6878; --line:#e1e6ec; --line-2:#cdd4dd;
  --accent:#2453d6; --accent-ink:#ffffff; --accent-soft:#e6edfd; --accent-ink-soft:#1b3fa6;
  --hero:#13203a; --hero-ink:#ffffff; --hero-muted:#b6c2d8;
  --ok:#137a43; --ok-soft:#e3f4ea; --warn:#9a5800; --warn-soft:#fdf0dc; --bad:#c22f25; --bad-soft:#fde7e5;
  --plan:#6643d1; --plan-soft:#efeafd;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 4px 16px rgba(14,23,38,.05);
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px; --r-sm:10px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f14; --surface:#141a22; --surface-2:#1b232d; --surface-3:#242e3a;
  --ink:#eef2f7; --ink-2:#cfd7e2; --muted:#9aa6b5; --line:#232c38; --line-2:#323e4d;
  --accent:#7ea3ff; --accent-ink:#0b1430; --accent-soft:#1a2747; --accent-ink-soft:#a9c1ff;
  --hero:#1a2742; --hero-ink:#ffffff; --hero-muted:#a9b7cf;
  --ok:#4fcf8a; --ok-soft:#12301f; --warn:#f0b357; --warn-soft:#352612; --bad:#ff7b70; --bad-soft:#3b1716;
  --plan:#b39dff; --plan-soft:#271f45;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0f14; --surface:#141a22; --surface-2:#1b232d; --surface-3:#242e3a;
  --ink:#eef2f7; --ink-2:#cfd7e2; --muted:#9aa6b5; --line:#232c38; --line-2:#323e4d;
  --accent:#7ea3ff; --accent-ink:#0b1430; --accent-soft:#1a2747; --accent-ink-soft:#a9c1ff;
  --hero:#1a2742; --hero-ink:#ffffff; --hero-muted:#a9b7cf;
  --ok:#4fcf8a; --ok-soft:#12301f; --warn:#f0b357; --warn-soft:#352612; --bad:#ff7b70; --bad-soft:#3b1716;
  --plan:#b39dff; --plan-soft:#271f45;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:24px;font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- estructura ---------- */
.shell{min-height:100dvh}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand svg{width:28px;height:28px;flex:none}
.topbar .tools{display:flex;align-items:center;gap:4px}
.main{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}
.pagehead p{color:var(--muted);font-size:14px;margin-top:2px}

/* barra inferior (móvil) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav .in{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:var(--nav-h);max-width:560px;margin:0 auto}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
.bnav a svg{width:22px;height:22px}
.bnav a[aria-current="page"]{color:var(--accent)}
.fab{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:none;display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);cursor:pointer;margin-top:-14px}
.fab svg{width:26px;height:26px}
/* barra lateral (escritorio) */
.side{display:none}
@media (min-width:960px){
  .bnav{display:none}
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;align-self:start;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:6px 10px 18px}
  .side a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:600}
  .side a.nav svg{width:20px;height:20px;color:var(--muted)}
  .side a.nav:hover{background:var(--surface-2)}
  .side a.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink-soft)}
  .side a.nav[aria-current="page"] svg{color:var(--accent)}
  .side .btn.primary{margin:0 0 14px}
  .side .foot{margin-top:auto}
  .topbar .brand{display:none}
  .main{padding-bottom:48px}
  .topbar .in{justify-content:flex-end}
}

/* ---------- componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h a{font-size:14px;font-weight:600;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink-soft)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border:none;background:none;border-radius:12px;color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.4}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plan{background:var(--plan-soft);color:var(--plan)} .chip.acc{background:var(--accent-soft);color:var(--accent-ink-soft)}
.chip svg,.hero .tag svg{width:15px;height:15px;flex:none}
.item .s .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
h1:focus{outline:none}
.sync{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 10px;border:none;background:none;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.sync:hover{background:var(--surface-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.saving i{background:var(--warn)} .sync.error i,.sync.auth i{background:var(--bad)}
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#fff}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.info{background:var(--accent-soft);color:var(--ink)}
.alert b{font-weight:700}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r-sm);font-size:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.hero .lbl{color:var(--hero-muted);font-size:13px;font-weight:600}
.hero .big{font-size:clamp(36px,9vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.hero .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid rgba(255,255,255,.14);padding-top:16px}
.hero .stats > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero .stats b{font-size:16px;font-weight:700}
.hero .stats .lbl{font-size:12px}
.hero .tag{display:inline-flex;align-items:center;gap:6px;line-height:1.35;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff}
.hero .tag.bad{background:#ffdcd8;color:#8a1c14} .hero .tag.ok{background:#d7f5e3;color:#0d5a31}
.hero a{color:#fff}

/* listas */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0;color:inherit;text-decoration:none;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.item:first-child{border-top:none}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .amt{font-weight:700;font-size:15.5px;text-align:right;white-space:nowrap}
.item .amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex:none}
a.item:hover,button.item:hover{background:linear-gradient(90deg,transparent,var(--surface-2) 12%,var(--surface-2) 88%,transparent)}
.dayhead{font-size:12.5px;font-weight:700;color:var(--muted);padding:14px 0 4px}
.dayhead:first-child{padding-top:0}

/* deudas */
.debtcard{display:flex;flex-direction:column;gap:12px;padding:16px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.debtcard:first-child{border-top:none;padding-top:2px}
.debtcard .top{display:flex;align-items:center;gap:12px}
.debtcard .nm{font-weight:700;font-size:15.5px}
.debtcard .bal{font-size:20px;font-weight:800;letter-spacing:-.02em}
.debtcard .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.debtcard .go{margin-left:auto;color:var(--muted);flex:none}
.debtcard .go svg{width:20px;height:20px;display:block}

/* detalle de deuda */
.dhero{display:flex;flex-direction:column;gap:14px}
.dhero .big{font-size:clamp(34px,8vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.milestones{display:flex;gap:6px;flex-wrap:wrap}
.milestones span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.milestones span.on{background:var(--ok-soft);color:var(--ok)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.actions .btn{flex-direction:column;gap:4px;min-height:64px;padding:8px 6px;font-size:12.5px;white-space:normal;text-align:center;line-height:1.2}
.actions .btn svg{width:20px;height:20px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.facts > div{padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.facts b{font-weight:700;font-size:15px}
.hist-row .amt{min-width:96px}
.hist-row .bal{font-size:12.5px;color:var(--muted);font-weight:600}

/* plan */
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.q{display:flex;flex-direction:column;gap:10px}
.q.short{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.q .qh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.q .qd{font-weight:800;font-size:16px;text-transform:capitalize}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;min-width:0}
.line .l{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.line .l .nm{overflow-wrap:anywhere;min-width:0}
.line .l .chip{flex:none}
.line .r{display:flex;align-items:center;gap:6px;flex:none}
.line.total{border-top:1px solid var(--line);padding-top:10px;font-weight:800;font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* gráficos */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f)}
.chart .area{fill:var(--accent);opacity:.12}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}
.chart .end{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .endl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f)}
.cats{display:flex;flex-direction:column;gap:12px}
.cat{display:flex;flex-direction:column;gap:6px}
.cat .row{gap:8px;flex-wrap:nowrap}
.cat .bar{height:8px}
.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.split > div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split b{font-size:16px;font-weight:800}

/* filtros */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav span{font-weight:700;min-width:128px;text-align:center;text-transform:capitalize}

/* formularios */
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f .full{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.field .help{font-size:12.5px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--bad);font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-2);border-radius:12px;padding:0 12px;min-height:48px;width:100%;min-width:0}
textarea{padding:10px 12px;min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[aria-invalid="true"]{border-color:var(--bad)}
input[type=color]{padding:4px;height:48px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px;min-height:44px;cursor:pointer}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 6px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);position:relative;text-align:center}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chips span{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2);background:var(--surface)}
.chips input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink-soft)}
.chips input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const APP_SCHEMA=2;

/* ================= íconos ================= */
const I={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',

  card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',

  cal:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 14h3"/>',
  fix:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/>'
};
const ic=(n,sw)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';

/* ================= utilidades ================= */
const CATS_G=['Comida','Transporte','Servicios','Hogar','Salud','Personal','Entretenimiento','Otros'];
const CATS_I=['Sueldo','Extra','Otro ingreso'];
const CATS_C=['Intereses','Compra con tarjeta','Comisión / seguro','Otro cargo'];
const CAT_COLOR={Comida:'#e07a1f',Transporte:'#2a7fd6',Servicios:'#0e9a8f',Hogar:'#8a5cd6',Salud:'#d6457a',Personal:'#c79a00',Entretenimiento:'#d6452a',Otros:'#6b7686',Sueldo:'#137a43',Extra:'#1f9d61','Otro ingreso':'#3aa776',Intereses:'#c22f25','Compra con tarjeta':'#b5502a','Comisión / seguro':'#9a5800','Otro cargo':'#7a4a3a'};
const r2=n=>Math.round((+n||0)*100)/100;
/* Monto escrito por la persona → número. Coma o punto como decimal; puntos o comas de miles en grupos de 3.
   "12,50"→12.5 · "140.81"→140.81 · "1.300"→1300 · una sola coma siempre es decimal · "1.234,56"→1234.56 · "12,5,0"→NaN · más de 2 decimales→NaN */
function parseMoney(v){
  if(typeof v==='number')return isFinite(v)?v:NaN;
  let s=String(v==null?'':v).trim();let neg=false;
  if(s.startsWith('-')||s.startsWith('−')){neg=true;s=s.slice(1).trim();}
  s=s.replace(/^\$\s*/,'');
  if(!s||!/^[\d.,]+$/.test(s)||/^[.,]|[.,]$/.test(s))return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');let ip,dp='';
  const groupsOk=g=>g[0].length>=1&&g[0].length<=3&&g.slice(1).every(x=>x.length===3);
  if(lc>-1&&ld>-1){
    const ds=lc>ld?',':'.',ts=ds===','?'.':',',i=s.lastIndexOf(ds);ip=s.slice(0,i);dp=s.slice(i+1);
    if(ip.includes(ds))return NaN;const g=ip.split(ts);if(!groupsOk(g))return NaN;ip=g.join('');
  }else if(lc>-1||ld>-1){
    const sep=lc>-1?',':'.',g=s.split(sep);
    if(g.length===2&&(sep===','||g[1].length!==3)){ip=g[0];dp=g[1];}
    else{if(!groupsOk(g))return NaN;ip=g.join('');}
  }else ip=s;
  if(dp.length>2||!/^\d+$/.test(ip)||(dp&&!/^\d+$/.test(dp)))return NaN;
  const n=+(ip+(dp?'.'+dp:''));return neg?-n:n;
}
const fmt=n=>{const v=r2(n);return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});};
const fmt0=n=>'$'+Math.round(n).toLocaleString('es-EC');
const fmtIn=n=>(n===''||n==null||isNaN(+n))?'':String(r2(n)).replace('.',',');
const esc=s=>String(s==null?'':s).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const safeColor=c=>/^#[0-9a-f]{6}$/i.test(String(c||''))?c:'#6b7686';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isIso=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
const parse=s=>{const p=String(s||'').split('-').map(Number);return new Date(p[0]||1970,(p[1]||1)-1,p[2]||1);};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dayIn=(y,m,day)=>{const f=new Date(y,m,1);return new Date(f.getFullYear(),f.getMonth(),Math.min(day,dim(f.getFullYear(),f.getMonth())));};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const daysBetween=(a,b)=>Math.round((b-a)/86400000);
const clean=s=>s.replace(/\./g,'');
const shortD=d=>clean(d.toLocaleDateString('es-EC',{weekday:'short',day:'numeric',month:'short'}));
const dm=d=>clean(d.toLocaleDateString('es-EC',{day:'numeric',month:'short'}));
const dmy=d=>clean(d.toLocaleDateString('es-EC',{day:'numeric',month:'short',year:'numeric'}));
const longD=d=>d.toLocaleDateString('es-EC',{weekday:'long',day:'numeric',month:'long'});
const monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('es-EC',{month:'long',year:'numeric'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const stamp=m=>m.recordedAt||m.createdAt||0;
const ord=(a,b)=>a.date===b.date?(stamp(a)-stamp(b)):(a.date<b.date?-1:1);
const kindLabel=k=>k==='prestamo'?'Préstamo':'Tarjeta';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const relDays=n=>n===0?'hoy':n===1?'mañana':n===-1?'ayer':n>0?'en '+n+' días':'hace '+(-n)+' días';
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},3000);}
function lsGet(k){try{return localStorage.getItem(k);}catch(_){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(_){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(_){}}

/* ================= validación del archivo de datos ================= */
const MOVE_TYPES=['ingreso','gasto','pago','cargo','ajuste','caja'];
const numOrNull=v=>v===''||v==null||isNaN(+v)?null:+v;
function cleanDebt(d){
  if(!d||typeof d!=='object')return null;
  const id=String(d.id||'');if(!/^[\w-]{1,64}$/.test(id))return null;
  return {id,name:String(d.name||'Deuda').slice(0,80),kind:d.kind==='prestamo'?'prestamo':'tarjeta',cuota:numOrNull(d.cuota)||0,
    dueDay:numOrNull(d.dueDay),cutDay:numOrNull(d.cutDay),priority:numOrNull(d.priority),minPayment:numOrNull(d.minPayment),contado:numOrNull(d.contado),
    rate:numOrNull(d.rate),original:numOrNull(d.original),totalInstallments:numOrNull(d.totalInstallments),color:safeColor(d.color),note:String(d.note||'').slice(0,500),archived:!!d.archived};
}
function cleanMove(m){
  if(!m||typeof m!=='object')return null;
  const id=String(m.id||'');if(!/^[\w-]{1,64}$/.test(id)||!MOVE_TYPES.includes(m.type)||!isIso(m.date)||isNaN(+m.amount))return null;
  const o={id,type:m.type,amount:+m.amount,date:m.date,status:m.status==='planificado'?'planificado':'hecho',note:String(m.note||'').slice(0,300),createdAt:+m.createdAt||0};
  if(m.recordedAt)o.recordedAt=+m.recordedAt||0;
  if(m.updatedAt)o.updatedAt=+m.updatedAt||0;
  if(m.debtId!=null)o.debtId=String(m.debtId);
  if(m.category!=null)o.category=String(m.category).slice(0,60);
  if(m.paidWith!=null)o.paidWith=String(m.paidWith);
  if(m.countsAsInstallment)o.countsAsInstallment=true;
  if(m.installments!=null&&m.installments!==''&&!isNaN(+m.installments))o.installments=+m.installments;
  if(m.excludeFromCash)o.excludeFromCash=true;
  return o;
}
const emptyData=()=>({schema:APP_SCHEMA,settings:{salary:450,payDays:[15,30],baseExpense:75},debts:[],moves:[]});
function normalize(d){
  if(!d||typeof d!=='object')d=emptyData();
  const s=d.settings||{};
  return {schema:+d.schema||APP_SCHEMA,
    settings:{salary:numOrNull(s.salary)??450,payDays:Array.isArray(s.payDays)?s.payDays.map(Number).filter(x=>x>=1&&x<=31):[15,30],baseExpense:numOrNull(s.baseExpense)??75},
    debts:(Array.isArray(d.debts)?d.debts:[]).map(cleanDebt).filter(Boolean),
    moves:(Array.isArray(d.moves)?d.moves:[]).map(cleanMove).filter(Boolean)};
}

/* ================= GitHub ================= */
function b64dec(s){const bin=atob(String(s).replace(/\s/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b);}
function b64enc(str){const b=new TextEncoder().encode(str);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin);}
function httpErr(status){const e=new Error('HTTP '+status);e.status=status;return e;}
const Store={
  cfg:null,
  load(){try{const c=JSON.parse(lsGet('mf.github')||'null');this.cfg=c&&c.owner&&c.repo&&c.token?c:null;}catch(_){this.cfg=null;}},
  save(c){this.cfg=c;lsSet('mf.github',JSON.stringify(c));},
  clear(){this.cfg=null;lsDel('mf.github');lsDel('mf.cache');lsDel('mf.outbox');},
  base(){return 'https://api.github.com/repos/'+encodeURIComponent(this.cfg.owner)+'/'+encodeURIComponent(this.cfg.repo);},
  url(){return this.base()+'/contents/'+(this.cfg.path||'data.json').split('/').map(encodeURIComponent).join('/');},
  headers(){return {'Authorization':'Bearer '+this.cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};},
  async req(url,opt){
    let r;try{r=await fetch(url,Object.assign({cache:'no-store'},opt||{}));}catch(_){throw httpErr(0);}
    return r;
  },
  async fetch(){
    const r=await this.req(this.url(),{headers:this.headers()});
    if(r.status===404){if(!(await this.repoVisible())){const e=httpErr(404);e.status='norepo';throw e;}return {missing:true};}
    if(!r.ok)throw httpErr(r.status);
    const j=await r.json();let content=j.content;
    if(!content&&j.sha){const b=await this.req(this.base()+'/git/blobs/'+j.sha,{headers:this.headers()});if(!b.ok)throw httpErr(b.status);content=(await b.json()).content;}
    return {sha:j.sha,data:JSON.parse(b64dec(content||''))};
  },
  async repoVisible(){const r=await this.req(this.base(),{headers:this.headers()});return r.ok;},
  async put(data,sha,msg){
    const body={message:msg||'Actualizar datos',content:b64enc(JSON.stringify(data))};if(sha)body.sha=sha;
    const r=await this.req(this.url(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},this.headers()),body:JSON.stringify(body)});
    if(!r.ok)throw httpErr(r.status);
    return (await r.json()).content.sha;
  }
};

/* ================= estado y cola de cambios ================= */
const S={remote:null,sha:null,data:null,outbox:[],sync:'idle',lastSync:null,flushing:false,gen:0,retryT:null,retryN:0,readOnly:false,
  route:'inicio',debtId:null,filter:'todos',month:null,confirm:null,dlg:null,opener:null,deferRender:false,openDetails:{},importPreview:null,
  bal:{},inst:{},ledger:{}};
/* Cada cambio es un dato (no una función), se guarda en el navegador y se reaplica sobre la última versión del archivo. */
function applyOp(d,op){
  const col=op.c==='debts'?d.debts:d.moves;
  if(op.k==='add'){if(!col.some(x=>x.id===op.v.id))col.push(clone(op.v));}
  else if(op.k==='patch'){const x=col.find(z=>z.id===op.id);if(x){Object.assign(x,clone(op.v));for(const k of (op.unset||[]))delete x[k];}}
  else if(op.k==='del'){const i=col.findIndex(z=>z.id===op.id);if(i>-1)col.splice(i,1);}
  else if(op.k==='settings')Object.assign(d.settings,clone(op.v));
  else if(op.k==='replace'){const n=normalize(op.v);d.settings=n.settings;d.debts=n.debts;d.moves=n.moves;}
}
function persistOutbox(){lsSet('mf.outbox',JSON.stringify(S.outbox));}
function recompute(){
  const d=normalize(clone(S.remote||emptyData()));
  for(const op of S.outbox){try{applyOp(d,op);}catch(_){}}
  S.data=d;derive();
}
function saveCache(){if(S.remote)lsSet('mf.cache',JSON.stringify({sha:S.sha,data:S.remote}));}
function setSync(s){S.sync=s;if(s==='ok')S.lastSync=new Date();renderSync();}
function commit(ops,msg){
  if(S.readOnly){toast('Estos datos fueron guardados por una versión más nueva de la app. Recarga la página.');return;}
  ops=Array.isArray(ops)?ops:[ops];ops.forEach(o=>{o.msg=msg;S.outbox.push(o);});
  persistOutbox();recompute();safeRender(true);flush();
}
async function flush(){
  if(S.flushing||!S.outbox.length||!Store.cfg||S.readOnly)return;
  S.flushing=true;S.gen++;clearTimeout(S.retryT);setSync('saving');
  let conflicts=0;
  try{
    while(S.outbox.length){
      const n=S.outbox.length,ops=S.outbox.slice(0,n);
      try{
        if(!S.remote||conflicts>0){const f=await Store.fetch();S.remote=f.missing?emptyData():normalize(f.data);S.sha=f.missing?null:f.sha;if((+S.remote.schema||0)>APP_SCHEMA){S.readOnly=true;break;}}
        const next=normalize(clone(S.remote));ops.forEach(o=>applyOp(next,o));next.schema=APP_SCHEMA;
        const msg=ops.length===1?ops[0].msg:(ops.length+' cambios');
        const sha=await Store.put(next,S.sha,msg);
        S.remote=next;S.sha=sha;S.outbox.splice(0,n);persistOutbox();saveCache();S.retryN=0;conflicts=0;
      }catch(e){
        if((e.status===409||e.status===422)&&conflicts<3){conflicts++;continue;}
        throw e;
      }
    }
    recompute();setSync(S.readOnly?'error':'ok');
  }catch(e){
    const auth=e.status===401||e.status===403||e.status==='norepo';
    setSync(auth?'auth':'error');
    if(!auth){S.retryN++;const wait=[5,15,30,60,120][Math.min(S.retryN-1,4)]*1000;S.retryT=setTimeout(flush,wait);}
  }finally{S.flushing=false;S.gen++;safeRender();}
}
async function pull(manual){
  if(!Store.cfg)return;
  if(S.outbox.length){flush();return;}
  if(S.flushing)return;
  const g=S.gen;
  try{
    if(manual)setSync('saving');
    const f=await Store.fetch();
    if(g!==S.gen||S.outbox.length||S.flushing)return;
    const nd=f.missing?emptyData():normalize(f.data),nsha=f.missing?null:f.sha;
    S.readOnly=(+nd.schema||0)>APP_SCHEMA;
    const changed=nsha!==S.sha;
    S.remote=nd;S.sha=nsha;saveCache();setSync(S.readOnly?'error':'ok');
    if(changed){recompute();safeRender();}
    if(manual)toast('Datos al día');
  }catch(e){const au=e.status===401||e.status===403||e.status==='norepo';setSync(au?'auth':'error');if(manual)toast(au?'El token no tiene acceso a tus datos.':'Sin conexión. Mostrando la copia guardada.');safeRender();}
}
function typing(){const a=document.activeElement;return a&&$('#view').contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);}
function safeRender(force){if(!force&&typing()){S.deferRender=true;return;}render();}
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.deferRender&&!typing()){S.deferRender=false;render();}},60);});
window.addEventListener('online',()=>{flush();pull(false);});

/* ================= cálculos ================= */
const cfg=()=>S.data.settings;
const payDays=()=>{const a=(cfg().payDays||[]).map(Number).filter(x=>x>=1&&x<=31).sort((a,b)=>a-b);return a.length?a:[15,30];};
const allDebts=()=>S.data.debts;
const debts=()=>S.data.debts.filter(d=>!d.archived);
const moves=()=>S.data.moves;
const debtById=id=>S.data.debts.find(d=>d.id===id);
const sortedDebts=()=>[...debts()].sort((a,b)=>(+a.priority||99)-(+b.priority||99)||String(a.name).localeCompare(b.name));
const isCashOut=m=>m.type==='pago'||(m.type==='gasto'&&(!m.paidWith||m.paidWith==='efectivo'||!debtById(m.paidWith)));
function derive(){
  S.bal={};S.inst={};S.ledger={};
  for(const d of allDebts()){
    const es=moves().filter(m=>m.status==='hecho'&&((m.debtId===d.id&&(m.type==='pago'||m.type==='cargo'||m.type==='ajuste'))||(m.type==='gasto'&&m.paidWith===d.id))).sort(ord);
    let bal=0,inst=0;const out=[];
    for(const m of es){
      if(m.type==='ajuste'){bal=+m.amount||0;if(m.installments!=null)inst=+m.installments;}
      else if(m.type==='pago'){bal-=+m.amount||0;if(m.countsAsInstallment)inst++;}
      else bal+=+m.amount||0;
      bal=r2(bal);out.push({m,bal,inst});
    }
    S.bal[d.id]=bal;S.inst[d.id]=inst;S.ledger[d.id]=out;
  }
}
function cashNow(){
  let v=0;
  for(const m of moves().filter(m=>m.status==='hecho'&&!m.excludeFromCash).sort(ord)){
    if(m.type==='caja')v=+m.amount||0;
    else if(m.type==='ingreso')v+=+m.amount||0;
    else if(isCashOut(m))v-=+m.amount||0;
  }
  return r2(v);
}
const balOf=d=>S.bal[d.id]||0;
const totalDebt=()=>r2(debts().reduce((s,d)=>s+Math.max(0,balOf(d)),0));
function monthSum(type,y,m){return r2(moves().filter(x=>x.type===type&&x.status==='hecho').filter(x=>{const d=parse(x.date);return d.getFullYear()===y&&d.getMonth()===m;}).reduce((s,x)=>s+(+x.amount||0),0));}
function paydaysFrom(start,count){const days=payDays(),out=[];let y=start.getFullYear(),m=start.getMonth(),g=0;while(out.length<count&&g<400){for(const d of days){const p=dayIn(y,m,d);if(p>=start&&out.length<count&&!out.some(x=>+x===+p))out.push(p);}m++;g++;}return out;}
const nextPayday=()=>paydaysFrom(today(),1)[0];
function nextDue(d,from){if(!d.dueDay)return null;let D=dayIn(from.getFullYear(),from.getMonth(),+d.dueDay);if(D<from)D=dayIn(from.getFullYear(),from.getMonth()+1,+d.dueDay);return D;}
const prevDue=(D,day)=>dayIn(D.getFullYear(),D.getMonth()-1,+day);
function duesBetween(day,a,b){const out=[];for(let k=-1;k<3;k++){const D=dayIn(a.getFullYear(),a.getMonth()+k,+day);if(D>=a&&D<b)out.push(D);}return out;}
function pagosIn(id,a,b,status){return r2(moves().filter(m=>m.type==='pago'&&m.debtId===id&&(!status||m.status===status)).filter(m=>{const d=parse(m.date);return d>a&&d<=b;}).reduce((s,m)=>s+(+m.amount||0),0));}
function firstTracked(id){const l=S.ledger[id]||[];return l.length?parse(l[0].m.date):null;}

function debtStatus(d){
  const t=today(),bal=balOf(d);
  if(bal<=0.005)return {cls:'ok',label:bal<-0.005?'Saldo a favor':'Pagada'};
  const D=nextDue(d,t);
  if(!D){
    const fut=moves().filter(m=>m.type==='pago'&&m.debtId===d.id&&m.status==='planificado').sort(ord)[0];
    return fut?{cls:'plan',label:'Plan '+dm(parse(fut.date))+' · '+fmt(fut.amount)}:{cls:'warn',label:'Falta fecha de pago'};
  }
  const need=Math.min(+d.cuota||0,bal);
  // cuota anterior: solo si ya la seguíamos durante todo ese ciclo
  const P=prevDue(D,d.dueDay),PP=prevDue(P,d.dueDay),ft=firstTracked(d.id);
  if(need>0&&ft&&ft<=PP&&P<t&&pagosIn(d.id,PP,P,'hecho')<need-0.01)return {cls:'bad',label:'Vencida '+dm(P),D:P,days:daysBetween(t,P),overdue:true};
  const paid=pagosIn(d.id,P,D,'hecho'),planned=pagosIn(d.id,P,D,'planificado'),days=daysBetween(t,D),base={D,days,paid,planned,need};
  if(need>0&&paid>=need-0.01)return Object.assign(base,{cls:'ok',label:'Cuota de '+dm(D)+' pagada'});
  if(need>0&&paid+planned>=need-0.01)return Object.assign(base,{cls:'plan',label:'Planificado · vence '+dm(D)});
  if(days<=3)return Object.assign(base,{cls:'bad',label:days===0?'Vence hoy':'Vence '+relDays(days)});
  if(days<=7)return Object.assign(base,{cls:'warn',label:'Vence '+relDays(days)});
  return Object.assign(base,{cls:'',label:'Vence '+dm(D)});
}
function payoffInfo(d){
  const B=balOf(d),p=+d.cuota||0,t=today();
  if(B<=0.005)return {text:'Deuda saldada',date:null};
  if(d.kind==='prestamo'&&+d.totalInstallments){
    const rem=(+d.totalInstallments)-(S.inst[d.id]||0);
    if(rem<=0)return {text:'Sin cuotas pendientes según tu registro',date:null};
    const D=nextDue(d,t);const L=D?dayIn(D.getFullYear(),D.getMonth()+rem-1,+d.dueDay):null;
    return {text:rem+' cuotas restantes · '+fmt(rem*p)+' por pagar',date:L,months:rem};
  }
  if(p<=0)return {text:'Define una cuota mensual para estimar cuándo terminas',date:null};
  const r=+d.rate||0;
  if(r>0){const i=r/1200;if(p<=B*i)return {text:'Con '+fmt(p)+' al mes no cubres el interés (≈'+fmt(B*i)+' al mes)',date:null,warn:true};
    const n=Math.ceil(-Math.log(1-i*B/p)/Math.log(1+i));return {text:'≈'+n+' meses pagando '+fmt(p)+' al mes',date:new Date(t.getFullYear(),t.getMonth()+n,1),months:n};}
  const n=Math.ceil(B/p);return {text:'≈'+n+' meses pagando '+fmt(p)+' al mes, sin contar interés',date:new Date(t.getFullYear(),t.getMonth()+n,1),months:n,noRate:true};
}
function progress(d){
  if(d.kind==='prestamo'&&+d.totalInstallments)return Math.max(0,Math.min(1,(S.inst[d.id]||0)/(+d.totalInstallments)));
  const o=+d.original||0,b=balOf(d);if(o<=0)return 0;return Math.max(0,Math.min(1,(o-b)/o));
}
function progressLabel(d){
  if(d.kind==='prestamo'&&+d.totalInstallments)return (S.inst[d.id]||0)+' de '+d.totalInstallments+' cuotas';
  const o=+d.original||0;return o>0?Math.round(progress(d)*100)+'% pagado de '+fmt(o):'';
}
/* Proyección: la primera ventana empieza HOY (incluye vencimientos y planes atrasados). */
function project(n){
  const c=cfg(),t=today();
  const fp=paydaysFrom(t,1)[0];
  const paidToday=moves().some(m=>m.type==='ingreso'&&m.status==='hecho'&&m.date===iso(t));
  let pays=paydaysFrom(addDays(t,1),n+1);
  if(fp&&+fp===+t&&!paidToday)pays=paydaysFrom(t,n+1);
  const bal={},inst={};debts().forEach(d=>{bal[d.id]=Math.max(0,balOf(d));inst[d.id]=S.inst[d.id]||0;});
  let running=cashNow();const out=[];
  for(let i=0;i<n;i++){
    const P=pays[i],N=pays[i+1],lo=i===0?new Date(1970,0,1):P,items=[];let extraIn=0,extraOut=0;
    const inW=s=>{const d=parse(s);return d>=lo&&d<N;};
    debts().forEach(d=>{if(d.kind!=='prestamo'&&+d.rate>0&&bal[d.id]>0)bal[d.id]=bal[d.id]*(1+(+d.rate)/100/24);});
    for(const m of moves()){
      if(m.status!=='planificado'||!inW(m.date))continue;
      const a=+m.amount||0,late=parse(m.date)<t;
      if(m.type==='pago'){const d=debtById(m.debtId);if(d&&d.archived)continue;items.push({kind:'plan',move:m,debt:d,amount:a,date:parse(m.date),late});
        if(d&&bal[d.id]!=null){bal[d.id]=Math.max(0,bal[d.id]-a);if(m.countsAsInstallment)inst[d.id]++;}}
      else if(m.type==='gasto'){if(!m.paidWith||m.paidWith==='efectivo'||!debtById(m.paidWith))extraOut+=a;else if(bal[m.paidWith]!=null)bal[m.paidWith]+=a;}
      else if(m.type==='ingreso')extraIn+=a;
    }
    for(const d of debts()){
      if(!d.dueDay||bal[d.id]<=0.005)continue;
      if(d.kind==='prestamo'&&+d.totalInstallments&&inst[d.id]>=+d.totalInstallments)continue;
      const lowD=i===0?t:P;
      for(const D of duesBetween(d.dueDay,lowD,N)){
        const prev=prevDue(D,d.dueDay);
        const already=r2(moves().filter(m=>m.type==='pago'&&m.debtId===d.id).filter(m=>{const x=parse(m.date);return x>prev&&x<=D;}).reduce((s,m)=>s+(+m.amount||0),0));
        const amt=r2(Math.min(+d.cuota||0,bal[d.id])-already);if(amt<=0.009)continue;
        items.push({kind:'auto',debt:d,amount:amt,date:D,partial:already>0});
        bal[d.id]=Math.max(0,bal[d.id]-amt);if(d.kind==='prestamo')inst[d.id]++;
      }
    }
    items.sort((a,b)=>a.date-b.date);
    const pagos=r2(items.reduce((s,x)=>s+x.amount,0)),income=r2((+c.salary||0)+extraIn),gastos=r2((+c.baseExpense||0)+extraOut);
    const sobra=r2(income-pagos-gastos);running=r2(running+sobra);
    out.push({P,N,items,pagos,income,gastos,extraOut,sobra,running,debt:r2(Object.values(bal).reduce((s,x)=>s+x,0))});
  }
  return out;
}

function avatar(label,color){return '<span class="avatar" style="background:'+safeColor(color)+'" aria-hidden="true">'+esc(String(label||'?').trim().charAt(0).toUpperCase())+'</span>';}
function chip(cls,t){return '<span class="chip '+cls+'">'+esc(t)+'</span>';}
function moveTitle(x){
  const d=debtById(x.debtId);const dn=d?d.name:'Deuda eliminada';
  switch(x.type){
    case 'pago':return 'Pago a '+dn;
    case 'cargo':return (x.category||'Cargo')+' · '+dn;
    case 'ajuste':return 'Saldo corregido · '+dn;
    case 'caja':return 'Efectivo corregido';
    case 'gasto':return x.category||'Gasto';
    default:return x.category||'Ingreso';
  }
}
function moveSub(x){
  const p=[];
  if(x.status==='planificado')p.push(chip(parse(x.date)<today()?'bad':'plan',parse(x.date)<today()?'Plan atrasado':'Planificado'));
  else if(x.type==='cargo')p.push(chip('bad','Cargo'));
  else if(x.type==='ajuste'||x.type==='caja')p.push(chip('warn','Corrección'));
  if(x.type==='gasto'&&x.paidWith&&x.paidWith!=='efectivo'){const c=debtById(x.paidWith);if(c)p.push('<span>con '+esc(c.name)+'</span>');}
  if(x.note)p.push('<span>'+esc(x.note)+'</span>');
  return p.join('');
}
function moveColor(x){const d=debtById(x.debtId);if((x.type==='pago'||x.type==='cargo'||x.type==='ajuste')&&d)return d.color;if(x.type==='caja')return '#6b7686';return CAT_COLOR[x.category]||'#6b7686';}
function moveAvatarLabel(x){const d=debtById(x.debtId);if((x.type==='pago'||x.type==='cargo'||x.type==='ajuste')&&d)return d.name.replace(/^banco\s+(del?\s+)?/i,'');return x.type==='caja'?'$':(x.category||'?');}

function chart(pts,label){
  if(pts.length<2)return '<div class="empty">Aún no hay suficientes registros para dibujar la línea.</div>';
  const W=680,H=220,L=56,R=70,T=14,B=28,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(1,...pts.map(p=>p.v));const step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/step)*step;
  const X=i=>L+i*(iw/(pts.length-1)),Y=v=>T+ih-(Math.max(0,v)/top)*ih;
  let g='';for(let k=0;k<=4;k++){const v=top*k/4,yy=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="axis" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+fmt0(v)+'</text>';}
  const every=Math.max(1,Math.ceil(pts.length/6));let xl='';pts.forEach((p,i)=>{if(i%every===0)xl+='<text class="axis" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(p.x)+'</text>';});
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=d+' L'+X(pts.length-1).toFixed(1)+' '+Y(0)+' L'+X(0)+' '+Y(0)+' Z';const last=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+g+xl+'<path class="area" d="'+area+'"/><path class="ln" d="'+d+'"/>'+
    '<circle class="pt" cx="'+X(0)+'" cy="'+Y(pts[0].v)+'" r="3.5"/><circle class="end" cx="'+X(pts.length-1)+'" cy="'+Y(last.v)+'" r="5"/>'+
    '<text class="endl" x="'+(X(pts.length-1)+9)+'" y="'+(Y(last.v)+4)+'">'+fmt0(last.v)+'</text></svg>';
}

function quincenaLines(q){
  let h='<div class="lines"><div class="line"><span class="l"><span class="nm">Sueldo</span></span><span class="r num pos">+'+fmt(q.income)+'</span></div>';
  for(const it of q.items){
    const nm=it.debt?it.debt.name:'Deuda eliminada';
    const tag=it.kind==='plan'?chip(it.late?'bad':'plan',it.late?'Atrasado':'Plan'):chip('',(it.partial?'Resto ':'Cuota ')+dm(it.date));
    const act=it.kind==='plan'
      ?'<button class="btn sm soft" type="button" data-action="done" data-id="'+esc(it.move.id)+'" aria-label="Marcar '+esc(nm)+' como pagado">'+ic('check',2.6)+'</button>'
      :'<button class="btn sm quiet" type="button" data-action="plan-auto" data-debt="'+esc(it.debt.id)+'" data-amount="'+it.amount+'" data-date="'+iso(q.P)+'">Planificar</button>';
    const name=it.kind==='plan'?'<button type="button" class="btn quiet sm" style="padding:0 4px;color:var(--ink);font-weight:600" data-action="edit" data-id="'+esc(it.move.id)+'">'+esc(nm)+'</button>':'<span class="nm">'+esc(nm)+'</span>';
    h+='<div class="line"><span class="l"><span class="dot" style="background:'+safeColor(it.debt&&it.debt.color)+'"></span>'+name+tag+'</span><span class="r"><span class="num">−'+fmt(it.amount)+'</span>'+act+'</span></div>';
  }
  h+='<div class="line"><span class="l"><span class="nm">Gastos para vivir'+(q.extraOut?' + extras':'')+'</span></span><span class="r num">−'+fmt(q.gastos)+'</span></div>';
  h+='<div class="line total"><span>'+(q.sobra>=0?'Te sobra':'Te falta')+'</span><span class="num '+(q.sobra>=0?'pos':'neg')+'">'+fmt(Math.abs(q.sobra))+'</span></div>';
  return h+'</div>';
}
function upcoming(days){
  const t=today(),lim=addDays(t,days),out=[];
  for(const q of project(4))for(const it of q.items){if(it.date<lim)out.push(Object.assign({q},it));}
  for(const d of debts()){const st=debtStatus(d);if(st.overdue)out.unshift({kind:'over',debt:d,amount:Math.min(+d.cuota||0,balOf(d)),date:st.D});}
  return out.sort((a,b)=>a.date-b.date).slice(0,8);
}

/* ================= vistas ================= */
function vInicio(){

/* ================= hoja de registro ================= */
function defaultsFor(D){
  const d=debtById(D.debtId);
  if(D.type==='pago'&&d){if(D.amount==='')D.amount=fmtIn(Math.min(+d.cuota||0,Math.max(0,balOf(d)))||'');D.countsAsInstallment=d.kind==='prestamo';}
  if(D.type==='ajuste'&&d&&D.mode==='new'){D.amount=fmtIn(balOf(d));D.installments=d.kind==='prestamo'?(S.inst[d.id]||0):'';}
  if(D.type==='caja'&&D.amount==='')D.amount=fmtIn(cashNow());
  if(D.type==='ingreso'&&D.amount==='')D.amount=fmtIn(cfg().salary);
  const cats=D.type==='ingreso'?CATS_I:D.type==='cargo'?CATS_C:CATS_G;
  if(!cats.includes(D.category))D.category=cats[0];
}
function openDlg(o){
  o=o||{};S.opener=document.activeElement;
  const first=(sortedDebts()[0]||{}).id;
  if(o.id){const m=moves().find(x=>x.id===o.id);if(!m)return;
    S.dlg={mode:'edit',id:m.id,orig:m,type:m.type,amount:fmtIn(m.amount),date:m.date,status:m.status,debtId:m.debtId||first,category:m.category||'',paidWith:m.paidWith||'efectivo',countsAsInstallment:!!m.countsAsInstallment,installments:m.installments==null?'':m.installments,note:m.note||'',lock:['cargo','ajuste','caja'].includes(m.type),confirmDel:false,touched:true};}
  else{
    S.dlg={mode:'new',type:o.type||'gasto',amount:o.amount!=null&&o.amount!==''?fmtIn(o.amount):'',date:o.date||iso(today()),status:o.status||'hecho',debtId:o.debt||first,category:'',paidWith:'efectivo',countsAsInstallment:false,installments:'',note:'',lock:['cargo','ajuste','caja'].includes(o.type),confirmDel:false};
    if(o.status==='planificado'&&!o.type)S.dlg.type='pago';
    defaultsFor(S.dlg);
  }
  dlgRender();const dl=$('#dlg');if(!dl.open)dl.showModal();
  setTimeout(()=>{const a=$('#dl-amount');if(a){a.focus();try{a.setSelectionRange(0,a.value.length);}catch(_){}}},60);
}
function amountPreview(){
  const D=S.dlg;if(!D)return '';const v=String(D.amount||'').trim();if(!v)return '';
  const p=parseMoney(v);
  if(isNaN(p))return '<span class="err">No entiendo ese monto. Usa por ejemplo 12,50 o 1.250,00 (máximo 2 decimales).</span>';
  const allowNeg=D.type==='ajuste'||D.type==='caja';
  if(p<0&&!allowNeg)return '<span class="err">El monto no puede ser negativo.</span>';
  return '<span class="help">Se guardará como <b>'+fmt(p)+'</b></span>';
}
function dlgRender(){
  const D=S.dlg,t=D.type,debt=debtById(D.debtId);
  const titles=D.mode==='edit'?{pago:'Editar pago',gasto:'Editar gasto',ingreso:'Editar ingreso',cargo:'Editar cargo',ajuste:'Editar corrección de saldo',caja:'Editar corrección de efectivo'}:{pago:'Pago a deuda',gasto:'Gasto',ingreso:'Ingreso',cargo:'Cargo o interés',ajuste:'Corregir saldo',caja:'Corregir efectivo'};
  let h='<span class="grab" aria-hidden="true"></span><div class="sh"><h2 id="dlg-title">'+titles[t]+'</h2><button class="iconbtn" type="button" data-action="close" aria-label="Cerrar">'+ic('close')+'</button></div><div class="sb"><div class="f">';
  if(!D.lock)h+='<div class="full seg" role="radiogroup" aria-label="Tipo de movimiento">'+[['gasto','Gasto'],['pago','Pago a deuda'],['ingreso','Ingreso']].map(x=>'<label><input type="radio" name="dl-type" data-k="type" value="'+x[0]+'"'+(t===x[0]?' checked':'')+'><span>'+x[1]+'</span></label>').join('')+'</div>';

  if(t==='ajuste')h+='<p class="full small muted">Pon el saldo exacto que te muestra el banco en esa fecha. Lo registrado antes queda reemplazado por este valor.</p>';
  if(t==='caja')h+='<p class="full small muted">Desde esta fecha la app suma tus ingresos y resta tus gastos y pagos.</p>';

      (t==='pago'&&debt?'<span class="help">Cuota '+fmt(debt.cuota)+(debt.minPayment!=null?' · mínimo '+fmt(debt.minPayment):'')+(debt.contado!=null?' · contado '+fmt(debt.contado):'')+'</span>':'')+'</div>';
  }
  if(t==='gasto'||t==='ingreso'||t==='cargo'){

  }
  if(t==='gasto'){
    const cards=debts().filter(d=>d.kind!=='prestamo');
    if(cards.length)h+='<div class="field"><label for="dl-pw">Pagado con</label><select id="dl-pw" data-k="paidWith"><option value="efectivo">Efectivo o débito</option>'+cards.map(d=>'<option value="'+esc(d.id)+'"'+(D.paidWith===d.id?' selected':'')+'>Tarjeta '+esc(d.name)+'</option>').join('')+'</select></div>';
  }
  h+='<div class="field"><label for="dl-date">Fecha</label><input id="dl-date" data-k="date" type="date" value="'+esc(D.date)+'"></div>';
  if(t==='pago'&&debt&&debt.kind==='prestamo')h+='<label class="full check"><input type="checkbox" data-k="countsAsInstallment"'+(D.countsAsInstallment?' checked':'')+'> Cuenta como una cuota del préstamo</label>';
  if(t==='ajuste'&&debt&&debt.kind==='prestamo')h+='<div class="field"><label for="dl-inst">Cuotas pagadas a esa fecha</label><input id="dl-inst" data-k="installments" type="number" inputmode="numeric" min="0" value="'+esc(D.installments)+'"></div>';
  if(t==='pago'||t==='gasto'||t==='ingreso')h+='<div class="full seg" role="radiogroup" aria-label="Estado"><label><input type="radio" name="dl-status" data-k="status" value="hecho"'+(D.status==='hecho'?' checked':'')+'><span>Ya lo hice</span></label><label><input type="radio" name="dl-status" data-k="status" value="planificado"'+(D.status==='planificado'?' checked':'')+'><span>Lo haré (plan)</span></label></div>';
  h+='<div class="field full"><label for="dl-note">Nota <span class="muted" style="font-weight:500">(opcional)</span></label><input id="dl-note" data-k="note" type="text" maxlength="160" value="'+esc(D.note)+'" placeholder="Ej. almuerzo, pago mínimo…"></div>';
  let hint='';
  if(t==='pago')hint=D.status==='planificado'?'Queda en tu plan. Cuando lo pagues, márcalo como hecho y el saldo bajará.':'El saldo de la deuda bajará con este pago.';
  if(t==='gasto'&&D.paidWith&&D.paidWith!=='efectivo')hint='No resta de tu efectivo: se suma a la deuda de la tarjeta.';
  const la=debt?[...(S.ledger[debt.id]||[])].reverse().find(e=>e.m.type==='ajuste'&&e.m.id!==D.id):null;
  if((t==='pago'||t==='cargo')&&la&&D.date&&D.date<la.m.date)hint='Atención: esta fecha es anterior a tu última corrección de saldo ('+dm(parse(la.m.date))+'), así que no cambiará el saldo actual.';
  if(hint)h+='<p class="full small muted">'+esc(hint)+'</p>';
  h+='</div></div><div class="sf">'+(D.mode==='edit'?(D.confirmDel?'<button class="btn danger solid" type="button" data-action="dlg-del">Sí, eliminar</button>':'<button class="btn danger" type="button" data-action="dlg-ask">Eliminar</button>'):'<span></span>')+'<button class="btn primary" type="submit" style="min-width:140px">Guardar</button></div>';
  $('#dlg-form').innerHTML=h;
}
function closeDlg(){const dl=$('#dlg');if(dl.open)dl.close();}
$('#dlg').addEventListener('close',()=>{S.dlg=null;const o=S.opener;S.opener=null;if(o&&document.contains(o)&&o.focus)o.focus();});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))closeDlg();});
$('#dlg-form').addEventListener('input',e=>{
  const k=e.target.dataset.k;if(!k||!S.dlg)return;
  S.dlg[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(k==='amount'){const p=$('#dl-prev');if(p)p.innerHTML=amountPreview();e.target.setAttribute('aria-invalid',String(String(S.dlg.amount).trim()!==''&&isNaN(parseMoney(S.dlg.amount))));
    if(S.dlg.type==='pago'&&!S.dlg.touchedInst){const d=debtById(S.dlg.debtId);if(d&&d.kind==='prestamo'){S.dlg.countsAsInstallment=(parseMoney(S.dlg.amount)||0)>=(+d.cuota||0)*0.9;const cb=$('#dlg-form [data-k=countsAsInstallment]');if(cb)cb.checked=S.dlg.countsAsInstallment;}}}
});
$('#dlg-form').addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k||!S.dlg)return;
  if(k==='countsAsInstallment')S.dlg.touchedInst=true;
  if(k==='type'){if(S.dlg.mode==='new'&&!S.dlg.touched)S.dlg.amount='';defaultsFor(S.dlg);dlgRender();}
  else if(k==='debtId'){if(S.dlg.mode==='new'&&!S.dlg.touched&&S.dlg.type!=='ajuste')S.dlg.amount='';if(S.dlg.type==='ajuste'&&S.dlg.mode==='new')S.dlg.amount='';defaultsFor(S.dlg);dlgRender();}
  else if(k==='status'||k==='paidWith'||k==='date')dlgRender();
});
$('#dlg-form').addEventListener('keydown',e=>{if(e.target.id==='dl-amount')S.dlg.touched=true;});
$('#dlg-form').addEventListener('submit',e=>{
  e.preventDefault();const D=S.dlg;if(!D)return;const t=D.type,raw=parseMoney(D.amount),amount=r2(raw),allowNeg=t==='ajuste'||t==='caja';
  if(isNaN(raw)||(!allowNeg&&amount<=0)){toast('Escribe un monto válido, por ejemplo 12,50');const a=$('#dl-amount');if(a){a.setAttribute('aria-invalid','true');a.focus();}return;}
  if(!isIso(D.date)){toast('Elige una fecha');return;}
  if((t==='pago'||t==='cargo'||t==='ajuste')&&!debtById(D.debtId)){toast('Primero agrega una deuda');return;}
  const rec={type:t,amount,date:D.date,status:(t==='pago'||t==='gasto'||t==='ingreso')?D.status:'hecho',note:String(D.note||'').trim().slice(0,160)};
  if(t==='pago'||t==='cargo'||t==='ajuste')rec.debtId=D.debtId;
  if(t==='pago'&&debtById(D.debtId).kind==='prestamo'&&D.countsAsInstallment)rec.countsAsInstallment=true;
  if(t==='ajuste'&&D.installments!==''&&D.installments!=null&&!isNaN(+D.installments))rec.installments=+D.installments;
  if(t==='gasto'||t==='ingreso'||t==='cargo')rec.category=D.category;
  if(t==='gasto')rec.paidWith=D.paidWith||'efectivo';
  const now=Date.now();
  if(D.mode==='new'){rec.id=uid();rec.createdAt=now;rec.recordedAt=now;commit({k:'add',c:'moves',v:rec},'Registrar '+t);}
  else{
    const o=D.orig,v={},unset=[];
    for(const k of Object.keys(rec))if(JSON.stringify(rec[k])!==JSON.stringify(o[k]))v[k]=rec[k];
    for(const k of ['debtId','category','paidWith','countsAsInstallment','installments'])if(o[k]!==undefined&&rec[k]===undefined)unset.push(k);
    if(v.date||v.status==='hecho')v.recordedAt=now;
    if(Object.keys(v).length||unset.length){v.updatedAt=now;commit({k:'patch',c:'moves',id:D.id,v,unset},'Editar '+t);}
  }
  const wasEdit=D.mode==='edit';closeDlg();toast(wasEdit?'Cambios guardados':rec.status==='planificado'?'Agregado a tu plan':'Registrado '+fmt(amount));
});

/* ================= acciones ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
  if(a==='new')openDlg({type:b.dataset.type,status:b.dataset.status,debt:b.dataset.debt,amount:b.dataset.amount});
  else if(a==='close')closeDlg();
  else if(a==='caja')openDlg({type:'caja'});
  else if(a==='edit')openDlg({id:b.dataset.id});
  else if(a==='plan-auto')openDlg({type:'pago',status:'planificado',debt:b.dataset.debt,amount:b.dataset.amount,date:b.dataset.date});
  else if(a==='dlg-ask'){S.dlg.confirmDel=true;dlgRender();const c=$('[data-action=dlg-del]');if(c)c.focus();}
  else if(a==='dlg-del'){const id=S.dlg.id;closeDlg();commit({k:'del',c:'moves',id},'Eliminar movimiento');toast('Movimiento eliminado');}
  else if(a==='filter'){S.filter=b.dataset.f;render();}
  else if(a==='month'){let {y,m}=S.month;m+=+b.dataset.d;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.month={y,m};render();const nb=$('[data-action=month][data-d="'+b.dataset.d+'"]');if(nb)nb.focus();}
  else if(a==='ask'){S.confirm=b.dataset.id;render();const c=$('[data-action=archive],[data-action=logout]');if(c)c.focus();}
  else if(a==='done'){const id=b.dataset.id,t=iso(today()),m=moves().find(x=>x.id===id);if(!m)return;const v={status:'hecho',recordedAt:Date.now(),updatedAt:Date.now()};if(m.date>t)v.date=t;commit({k:'patch',c:'moves',id,v},'Marcar hecho');toast('Marcado como hecho');}
  else if(a==='archive'){const id=b.dataset.id;S.confirm=null;commit({k:'patch',c:'debts',id,v:{archived:true}},'Archivar deuda');location.hash='#deudas';toast('Deuda archivada');}
  else if(a==='unarchive'){commit({k:'patch',c:'debts',id:b.dataset.id,v:{archived:false}},'Restaurar deuda');toast('Deuda restaurada');}
  else if(a==='pull')pull(true);
  else if(a==='logout'){Store.clear();S.remote=null;S.data=null;S.sha=null;S.outbox=[];S.confirm=null;location.hash='#conexion';render();}
  else if(a==='export'){const blob=new Blob([JSON.stringify(S.data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='mis-finanzas-'+iso(today())+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}
  else if(a==='import'){const f=$('#imp-file');if(f){f.value='';f.click();}}
  else if(a==='import-ok'){const d=S.importPreview;S.importPreview=null;if(d){commit({k:'replace',v:d},'Restaurar copia');toast('Copia restaurada');}}
  else if(a==='import-cancel'){S.importPreview=null;render();}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='imp-file'||!e.target.files||!e.target.files[0])return;
  const file=e.target.files[0];e.target.value='';
  const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(!raw||typeof raw!=='object'||!Array.isArray(raw.debts)||!Array.isArray(raw.moves))throw 0;S.importPreview=normalize(raw);render();}catch(_){toast('Ese archivo no es una copia válida de Mis Finanzas');}};r.readAsText(file);
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();const fd=new FormData(f);
  const bad=[...f.querySelectorAll('[data-money]')].find(i=>i.value.trim()!==''&&isNaN(parseMoney(i.value)));
  if(bad){bad.setAttribute('aria-invalid','true');bad.focus();toast('Revisa este monto: '+bad.value);return;}
  const num=k=>{const v=fd.get(k);if(v===''||v==null)return null;const p=parseMoney(v);return isNaN(p)?null:r2(p);};
  const int=k=>{const v=fd.get(k);if(v===''||v==null||isNaN(+v))return null;return Math.round(+v);};
  if(f.dataset.form==='settings'){
    const days=String(fd.get('payDays')).split(/[,\s;]+/).map(Number).filter(x=>x>=1&&x<=31);
    commit({k:'settings',v:{salary:num('salary')||0,payDays:days.length?days:[15,30],baseExpense:num('baseExpense')||0}},'Ajustes');toast('Ajustes guardados');
  }else if(f.dataset.form==='debt'||f.dataset.form==='debt-new'){
    const day=k=>{const v=int(k);return v!=null&&v>=1&&v<=31?v:null;};
    const data={name:String(fd.get('name')||'').trim().slice(0,80),kind:fd.get('kind')==='prestamo'?'prestamo':'tarjeta',cuota:num('cuota')||0,dueDay:day('dueDay'),cutDay:day('cutDay'),priority:int('priority'),
      minPayment:num('minPayment'),contado:num('contado'),rate:num('rate'),original:num('original'),totalInstallments:int('totalInstallments'),color:safeColor(fd.get('color')),note:String(fd.get('note')||'').trim().slice(0,500)};
    if(!data.name){toast('Ponle un nombre');return;}
    if(data.rate!=null&&(data.rate<0||data.rate>100)){toast('Revisa la tasa: debe estar entre 0 y 100');const r=f.querySelector('[name=rate]');if(r){r.setAttribute('aria-invalid','true');r.focus();}return;}
    if(f.dataset.form==='debt'){commit({k:'patch',c:'debts',id:f.dataset.id,v:data},'Editar deuda');S.openDetails['edit-'+f.dataset.id]=false;toast('Cambios guardados');render();}
    else{
      const bal=num('balance');if(bal==null){toast('Escribe el saldo que debes hoy');return;}
      const id=uid(),inst=int('installments'),now=Date.now();if(data.original==null)data.original=bal;data.id=id;data.archived=false;if(data.priority==null)data.priority=debts().length+1;
      const adj={id:uid(),type:'ajuste',debtId:id,amount:bal,date:iso(today()),status:'hecho',note:'Saldo inicial',createdAt:now,recordedAt:now};if(inst!=null)adj.installments=inst;
      S.openDetails['new-debt']=false;commit([{k:'add',c:'debts',v:data},{k:'add',c:'moves',v:adj}],'Agregar deuda');toast('Deuda agregada');location.hash='#deuda-'+id;
    }
  }else if(f.dataset.form==='connect'){
    const c={owner:String(fd.get('owner')).trim(),repo:String(fd.get('repo')).trim(),path:'data.json',token:String(fd.get('token')).trim()};
    const msg=$('#cx-msg'),btn=f.querySelector('button[type=submit]');msg.className='full small muted';msg.textContent='Conectando…';btn.disabled=true;
    const prev=Store.cfg;Store.cfg=c;
    Store.fetch().then(r=>{
      Store.save(c);S.remote=r.missing?emptyData():normalize(r.data);S.sha=r.missing?null:r.sha;S.readOnly=(+S.remote.schema||0)>APP_SCHEMA;saveCache();recompute();setSync('ok');
      location.hash='#inicio';readRoute();render();toast('Conectado');if(S.outbox.length||r.missing)flush();
    }).catch(err=>{Store.cfg=prev;btn.disabled=false;msg.className='full small neg';
      msg.textContent=err.status==='norepo'?'El token no puede ver el repositorio privado. En GitHub edita el token: Repository access → Only select repositories → '+c.repo+', con Contents: Read and write.':err.status===401?'GitHub rechazó el token. Revisa que lo copiaste completo.':err.status===403?'El token no tiene permiso Contents: Read and write en ese repositorio.':err.status===0?'Sin conexión a internet.':'No se pudo conectar (error '+err.status+').';});
  }
});

/* ================= arranque ================= */
readRoute();Store.load();
try{S.outbox=JSON.parse(lsGet('mf.outbox')||'[]');if(!Array.isArray(S.outbox))S.outbox=[];}catch(_){S.outbox=[];}
if(Store.cfg){
  try{const c=JSON.parse(lsGet('mf.cache')||'null');if(c&&c.data){S.remote=normalize(c.data);S.sha=c.sha||null;}}catch(_){}
  if(S.remote||S.outbox.length){recompute();}
  render();
  (async()=>{
    try{const f=await Store.fetch();S.remote=f.missing?emptyData():normalize(f.data);S.sha=f.missing?null:f.sha;S.readOnly=(+S.remote.schema||0)>APP_SCHEMA;saveCache();recompute();setSync(S.readOnly?'error':'ok');}
    catch(e){const au=e.status===401||e.status===403||e.status==='norepo';setSync(au?'auth':'error');if(!S.data&&!au){S.remote=null;}}
    render();if(S.outbox.length)flush();
  })();
}else render();
setInterval(()=>{if(document.visibilityState==='visible')pull(false);},45000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull(false);});
})();
</script>
</body>
</html>
